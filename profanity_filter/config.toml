# Profanity_Filter - defaults  (override any of these on the command line)

# "mute"  (default) - silence the flagged span. Every span is stemmed
#          (mute_fill below), on any channel count - no automatic
#          center-channel-only muting anymore (see AGENTS.md).
# "bleep" - every channel is muted and a 1 kHz tone laid over it.
# "cut"   - the flagged span is spliced out entirely, shortening the file.
#           AUDIO-ONLY INPUTS ONLY (e.g. audiobooks) - refuses any input with
#           a real video track (embedded cover art doesn't count), since
#           cutting a video's audio would desync it from the picture. No
#           "keep the original as an alt track" either, since the duration
#           changed - the output is just the cut file itself, same
#           container/codec as the source, no mkvmerge remux.
# "dialog" - a different job: strip ALL dialogue (not just flagged words -
#           the wordlists aren't consulted) into a new "(Wordless)" alt
#           track. Always stems every channel by default - see center_mute
#           below for the opt-in center-channel-only alternative.
#           See dialog_track_suffix / dialog_track_default below.
method = "mute"

# which flag_language categories to act on (from Voice_to_Text/wordlists/)
categories = ["profanity", "irreverence"]

# padding (seconds) added before / after each flagged word before removing it.
# aligned word timestamps often start a hair late, so pad_start >= pad_end.
pad_start = 0.10
pad_end = 0.10
merge_gap = 0.20             # merge two flagged spans closer than this into one

# "dialog" only: mute just the center channel for the whole file instead of
# stemming dialogue out of every channel. NEVER auto-detected - only set this
# per file when you already know the source's dialogue is genuinely
# center-isolated (e.g. via _whisperx_check.py); fails loudly instead of
# silently falling back to stemming if the track has no recognised center
# channel. Leave false (the default) for anything with a real mixed audio
# track (songs, panned dialogue, effects sharing the center channel) - see
# AGENTS.md's "Center-channel-only removal" for why this stopped being
# automatic.
center_mute = false

# "mute" only:
#   "stems"   (default) - a high-quality stemmer (audio-separator) pulls the
#             ambient noise/music out of the whole track ahead of time, and
#             THAT plays through the muted span instead of dead air. Falls
#             back to "silence" automatically if the stemmer isn't installed
#             (see README.md for the one-time setup - it's a separate venv,
#             nothing this needs touches your global Python packages).
#   "silence" - the old behaviour: the muted span is dead air.
mute_fill = "stems"

# audio-separator model used for stemming (mute_fill = "stems", and
# method = "dialog" whenever it can't just mute a center channel). Must be a
# model that splits into Vocals/Instrumental stems - only the Instrumental
# one is ever kept.
stem_model = "UVR-MDX-NET-Inst_HQ_3.onnx"

# mute_fill = "stems" only: whether to stem each flagged span separately or
# the whole track once is decided automatically per movie, from a real
# time-cost model calibrated against this machine's GPU (see
# STEM_STARTUP_S/STEM_RATE/_predict_stem_seconds in clean.py) - not
# something to configure here.

# "bleep" only: the tone
beep_hz = 1000
beep_gain_db = -6.0          # tone PEAK level, dBFS (0 = full scale; -6 is a loud, clear bleep)

# "cut" only: bitrate for a lossy source codec (audiobooks are low-bitrate
# speech; lossless sources - flac/wav/alac - re-encode losslessly instead)
cut_bitrate = "96k"

# encoding of the cleaned audio track - the ONLY thing re-encoded.
# everything else (video, subs, other audio) is a straight mkvmerge remux.
# ac3/eac3/aac keep the output size close to the source; flac is lossless but
# much bigger.
clean_codec = "ac3"                # ac3 | eac3 | aac | flac (lossless)
clean_bitrate = "224k"             # lossy codecs only, for a <=2 channel source
clean_bitrate_surround = "448k"    # lossy codecs only, for a >2 channel source
#                                    (ignored if --clean-bitrate is passed explicitly)

# which source audio track to clean:
#   "default"  -> the file's default audio track
#   "0","1"..  -> that audio track by index
#   "eng"      -> first audio track with that language
source_track = "default"

track_name_suffix = " (Cleaned)"
# used instead of track_name_suffix above when faith_detection (below) swaps
# in the stricter *_strict wordlists for an overtly Christian/faith-based
# title, so that version's track/filename is distinguishable from a
# normal-rules "(Cleaned)" one at a glance.
faith_track_suffix = " (Cleaned - Christian Edition)"
sync_ms = 0                  # mkvmerge --sync for the clean track; bump if lip-sync drifts

# "dialog" only: name/default-ness of the new dialogue-free track.
dialog_track_suffix = " (Wordless)"
dialog_track_default = false  # true = make it the default audio track (like "(Cleaned)" does);
#                                false (default) = add it as a non-default alt track instead

# embedded SubRip subtitles: every cue that overlaps a removed span gets its
# profane words censored, then re-muxed as a new default "(Cleaned)" track.
# method="mute" removes the word entirely (no audible trace is left either);
# method="bleep" replaces it with subs_mask instead, matching the audible tone.
# ("default" below means subtitle cleaning is ON whenever the source has a usable
# text-based subtitle track - "none" is the only way to turn it off.)
subs_track = "default"       # "default" | index | language | "none" to leave subs alone
subs_mask = "***"            # used only when method="bleep" - method="mute" always removes the word
subs_pad = 0.15            # seconds of slack when matching cues to bleep spans

# an external subtitle FILE next to the input (e.g. "Movie.srt", "Movie.en.srt")
# - tried between an embedded text/CC608 track and OCR'ing an embedded PGS/
# VobSub bitmap track (see the discovery-order comment below). Treated exactly
# like OpenSubtitles, not like an embedded track: it isn't assumed to already
# match this exact file's cut, so it's resynced against the transcript's own
# word timings the same way, and adds the same two tracks - an uncensored
# "(Sidecar)" (non-default) and a censored "(Sidecar) (Cleaned)" (default).
sidecar_subs = true
sidecar_lang = ""            # 2- or 3-letter language to prefer when more than one sidecar file
#                                exists ("" = derive from the chosen audio track's own language)

# last resort in the subtitle-discovery chain (text track -> CC608 -> sidecar
# file -> PGS OCR -> VobSub OCR -> OpenSubtitles), tried only when there's no
# usable local subtitle at all - the common case for a TV recording. Needs an
# API key -
# see opensubtitles.py's docstring / README "OpenSubtitles setup". The
# fetched file's own timestamps are never trusted (a TV recording has
# commercial breaks/station cuts a retail release doesn't, on top of plain
# drift) - real timing is rebuilt from a whole-file text alignment against
# the transcript instead (flag_language.resync_units_to_transcript). On
# success this adds TWO new subtitle tracks - unlike every other source
# above, an OpenSubtitles subtitle doesn't already exist anywhere in the
# source file, so both an uncensored "(OpenSubtitles)" (non-default) and a
# censored "(OpenSubtitles) (Cleaned)" (default) track are muxed in.
opensubtitles = true
opensubtitles_lang = "en"    # 2-letter language to search/download
opensubtitles_query = ""     # override the title auto-guessed from the filename
opensubtitles_id = ""        # exact OpenSubtitles file_id to download - bypasses search

# detect an overtly Christian / faith-based title (movie OR TV, via its
# filename's "SxxExx") with a TMDB genre/keyword lookup (tmdb.py) and, when
# found, swap "irreverence"/"profanity" for the stricter
# "irreverence_strict"/"profanity_strict" wordlists (wordlists/*_strict.txt)
# - irreverence.txt's exclamation patterns ("sweet Jesus", "my Lord", "God
# willing", ...) and profanity.txt's bare "hell"/"ass"/"whore"/"prick" are
# overwhelmingly SINCERE prayer/worship or literal scripture in that genre,
# not profanity, so removing them undoes exactly what this tool is for.
# Needs a free TMDB API key (see tmdb.py docstring - TMDB_API_KEY env var, or
# a gitignored tmdb.key file next to tmdb.py); degrades gracefully (a
# warning, the normal wordlists are used) without one, or when neither
# category is even in `categories` to begin with. Result is cached next to
# the input as "<name>.tmdb.meta.json".
faith_detection = true
tmdb_query = ""              # override the title auto-guessed from the filename for the TMDB lookup

# cross-check the embedded SRT for profanity the transcript missed entirely
# (dropped or mis-heard words); located via the transcript's own word timings
# where possible, interpolated between neighbours otherwise. See
# flag_language.backfill_from_srt().
srt_backfill = true

# scratch dir for temp files + --keep-temp debug artifacts (relative to this
# folder, or an absolute path) - NOT where the cleaned result ends up. The
# result always replaces the source file in place (new primary/default audio
# track, and where possible a new primary/default subtitle track); the
# pre-clean original is moved to the Windows Recycle Bin, never deleted
# outright, once the build succeeds. See AGENTS.md "Replacing the source in
# place".
output_dir = "out"
retranscribe = false         # true = always re-run Voice_to_Text even if <name>.json exists

# only matters when the destination's extension differs from the source's
# (mute/bleep/dialog on a non-.mkv source) and something from an earlier run
# already sits there - when source and destination are the same path (the
# common case), there's nothing to guard, since replacing the source IS the
# point.
overwrite = false
